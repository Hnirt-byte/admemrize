name: admemrize

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admemrize
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: admemrize
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    # Aucun "ports:" ici : Postgres n'est joignable que depuis le réseau interne
    # d'ADMEMRIZE. Hermes (autre projet Docker) n'y a aucune route.
    # Nuance : sur ce VPS, Traefik tourne en network_mode host — il a donc, comme
    # l'hôte lui-même, une route locale directe vers ce réseau malgré "internal: true"
    # (qui bloque la sortie Internet, pas l'accès depuis l'hôte). Postgres reste
    # protégé par son mot de passe, jamais connu de Traefik. Voir section 6 de
    # architecture-v1-addendum.md pour le détail de ce compromis assumé.

  admemrize-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
    networks:
      - internal # pour parler à postgres
      - public # accès sortant Internet (Scaleway) ; Traefik (host network) atteint ce
      # conteneur directement via ce réseau, sans qu'il ait besoin d'être "partagé"
    labels:
      - traefik.enable=true
      - traefik.http.routers.admemrize-api.rule=Host(`${ADMEMRIZE_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.admemrize-api.entrypoints=websecure
      - traefik.http.routers.admemrize-api.tls=true
      - traefik.http.routers.admemrize-api.priority=10 # priorité > admemrize-web pour matcher /api avant le catch-all
      - traefik.http.services.admemrize-api.loadbalancer.server.port=3000
    # Pas de "ports:" en prod : voir docker-compose.override.yml pour le dev local.

  admemrize-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    networks:
      - public # sert uniquement les fichiers statiques de la PWA, jamais accès à internal/postgres
    labels:
      - traefik.enable=true
      - traefik.http.routers.admemrize-web.rule=Host(`${ADMEMRIZE_DOMAIN}`)
      - traefik.http.routers.admemrize-web.entrypoints=websecure
      - traefik.http.routers.admemrize-web.tls.certresolver=letsencrypt
      - traefik.http.routers.admemrize-web.priority=1
      - traefik.http.services.admemrize-web.loadbalancer.server.port=80
    # Nommage préfixé "admemrize-" pour éviter toute collision de nom de routeur Traefik
    # avec Hermes ou un futur projet découvert par le même Traefik.

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
    networks:
      - internal # pour parler à postgres
      - public # accès sortant uniquement (suppression des objets sur Scaleway) ;
      # jamais de label traefik.enable, donc jamais routé depuis l'extérieur.

networks:
  internal:
    driver: bridge
    internal: true # aucune route sortante vers Internet pour Postgres
  public:
    driver: bridge
    # Réseau bridge Compose standard, créé et géré automatiquement — PAS "external".
    # Traefik (network_mode: host sur ce VPS) atteint ce réseau nativement, sans
    # qu'il ait besoin d'exister au préalable ni d'être partagé explicitement :
    # exactement comme il atteint déjà Hermes sur son propre réseau isolé.

volumes:
  postgres_data:
